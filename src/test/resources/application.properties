# Configuracion SOLO para pruebas: H2 en memoria (no toca la BD real)
spring.datasource.url=jdbc:h2:mem:logiexpress_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=TEST_SECRET_KEY_MIN_32_CHARACTERS_LONG_123456
app.jwt.expiration-ms=3600000
