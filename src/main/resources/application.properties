spring.application.name=miniproyecto

# --- Base de datos (credenciales por variables de entorno, nunca en el repositorio)
spring.datasource.url=jdbc:sqlserver://163.178.173.130;databaseName=ExpresoFastC5H060_II2026;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:Lenguajes}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_KEY_MIN_32_CHARACTERS_LONG}
app.jwt.expiration-ms=3600000

# --- Nunca exponer stacktrace al cliente
server.error.include-stacktrace=never
server.error.include-message=never
